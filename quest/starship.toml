# Приглашение терминала райса Quest: строка как в диалоге ролевой игры — «▶» курсора-руки, герой и локация,
# урон «-HP» при ошибке. Цвета — 16 цветов темы (жёлтый — золото курсора, зелёный — HP, синий — MP).
format = """[$username](bold yellow) [@](bright-black) [$directory](bold blue)$git_branch$git_status$cmd_duration$status
$character"""
add_newline = true

[username]
show_always = true
format = "[$user]($style)"
style_user = "bold yellow"

[directory]
format = "[$path]($style)[$read_only]($read_only_style) "
style = "bold blue"
read_only = " [заперто]"
truncation_length = 3
truncation_symbol = "…/"

[git_branch]
format = "[⚔ $branch]($style) "
style = "green"

[git_status]
format = "([\\[$all_status$ahead_behind\\]]($style) )"
style = "yellow"

[cmd_duration]
format = "[ход $duration]($style) "
style = "bright-black"

[status]
disabled = false
format = "[-$status HP]($style) "
style = "bold red"

[character]
success_symbol = "[▶](bold yellow)"
error_symbol = "[▶](bold red)"
vimcmd_symbol = "[◀](bold green)"
